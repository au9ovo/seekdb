name: File SQL Test Only

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch containing the integration test
        required: true
        default: feat/file-as-database
      runtime_run_id:
        description: Workflow run containing file-sql-seekdb and file-sql-obclient
        required: true

jobs:
  file-sql-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v3
        with:
          repository: au9ovo/seekdb
          ref: ${{ inputs.source_ref }}

      - name: Install runtime dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y gdb libaio1 libncurses5 python3

      - name: Download seekdb runtime
        uses: actions/download-artifact@v4
        with:
          name: file-sql-seekdb
          path: .seekdb_runtime/seekdb-bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime_run_id }}

      - name: Download obclient runtime
        uses: actions/download-artifact@v4
        with:
          name: file-sql-obclient
          path: .seekdb_runtime/obclient
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime_run_id }}

      - name: Run file SQL integration test
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD"
          SEEKDB_BINARY="$REPO_ROOT/.seekdb_runtime/seekdb-bin/seekdb"
          CLIENT_ROOT="$REPO_ROOT/.seekdb_runtime/obclient"
          chmod +x "$SEEKDB_BINARY" "$CLIENT_ROOT/bin/obclient" "$CLIENT_ROOT/bin/mysqltest"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          BASE="$RUNNER_TEMP/seekdb-file-sql-instance"
          WORK="$RUNNER_TEMP/seekdb-file-sql-work"
          rm -rf "$BASE" "$WORK"
          mkdir -p "$WORK/tmp" "$WORK/mysqltest_log"
          printf '%s\n' \
            '1,Alice,1.5,true,2026-08-01,2026-08-01 10:11:12' \
            '2,Bob,2,false,,' > "$WORK/headerless.csv"
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern='core.%p'
          python3 .github/script/seekdb/sdb.py start \
            --binary "$SEEKDB_BINARY" --base-dir "$BASE" --port 2881
          trap 'python3 .github/script/seekdb/sdb.py destroy --base-dir "$BASE" >/dev/null 2>&1 || true' EXIT
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" --base-dir "$BASE" \
            --host 127.0.0.1 --port 2881 --user root --timeout 600
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uroot -A -c \
            -Doceanbase < "$REPO_ROOT/tools/deploy/init.sql"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uroot -A -c \
            -Doceanbase -e "set global ob_enable_plan_cache = OFF;"
          DATA_DIR="$BASE/data_for_mysqltest_file_sql"
          mkdir -p "$DATA_DIR"
          cp "$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/data/"* "$DATA_DIR/"
          base64 -d "$DATA_DIR/simple.parquet.b64" > "$DATA_DIR/simple.parquet"
          rm -f "$DATA_DIR/simple.parquet.b64"
          export OBMYSQL_PORT=2881
          export OBMYSQL_MS0=127.0.0.1
          export OBMYSQL_MS0_DEV=127.0.0.1
          export OBMYSQL_PWD=admin
          export OBMYSQL_USR=admin
          export OBSERVER_DIR="$BASE"
          export FILE_SQL_REPO_ROOT="$REPO_ROOT"
          export IS_BUSINESS=0
          export TENANT=mysql
          set +e
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select substring_index('/abc/def.csv', '/', -1) as leaf;"
          echo "substring_index_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; set session ob_log_level = 'TRACE'; select count(*) as file_count from glob('$DATA_DIR/*');"
          echo "glob_count_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select file from glob('$DATA_DIR/*');"
          echo "glob_file_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select substring_index(file, '/', -1) as leaf from glob('$DATA_DIR/*');"
          echo "glob_substring_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select _c1, _c2, _c3, _c4, _c5, _c6 from read_csv('$WORK/headerless.csv', header = false) order by _c1;"
          echo "headerless_select_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; describe select * from read_csv('$WORK/headerless.csv', header = false);"
          echo "headerless_describe_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select active, count(*) as row_count, sum(id) as id_sum from read_csv('$DATA_DIR/basic.csv') group by active having sum(id) >= 2 order by active desc limit 2;"
          echo "group_having_rc=$?"
          COPY_FILE="$WORK/copy_smoke.csv"
          rm -f "$COPY_FILE"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; copy (select id, name from read_csv('$DATA_DIR/basic.csv') order by id) to '$COPY_FILE' (format csv, header, nullstr 'NULL');"
          echo "copy_rc=$?"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select id, name from read_csv('$COPY_FILE') order by id;"
          echo "copy_read_rc=$?"
          printf 'sentinel\n' > "$COPY_FILE"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; copy (select id from read_csv('$DATA_DIR/basic.csv')) to '$COPY_FILE' (format csv, header);"
          echo "copy_exists_rc=$?"
          echo "copy_exists_content=$(cat "$COPY_FILE")"
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; create table file_sql_copy_smoke (id bigint, name varchar(32)); insert into file_sql_copy_smoke values (4, 'Delta'), (5, 'Echo'); copy file_sql_copy_smoke to '$WORK/table_copy_smoke.csv' (format csv, header, nullstr 'NULL'); select id, name from read_csv('$WORK/table_copy_smoke.csv') order by id; drop table file_sql_copy_smoke;"
          echo "table_copy_rc=$?"
          set -e
          set +e
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uadmin -padmin -A -c -Dtest \
            -e "set session enable_file_sql = ON; select count(*) from read_csv('$DATA_DIR/basic.csv');"
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 0 ]; then
            mkdir -p "$WORK/failures"
            cp -a "$BASE/log" "$WORK/failures/seekdb_log" 2>/dev/null || true
            core_file="$(find "$BASE" -maxdepth 2 -type f -name 'core.*' | head -1)"
            if [ -n "$core_file" ]; then
              cp "$core_file" "$WORK/failures/"
              gdb -batch -ex 'thread apply all bt full' "$SEEKDB_BINARY" "$core_file" \
                > "$WORK/failures/backtrace.txt" 2>&1 || true
            fi
            exit "$smoke_rc"
          fi
          cd "$REPO_ROOT/tools/deploy"
          set +e
          "$CLIENT_ROOT/bin/mysqltest" \
            --host=127.0.0.1 --port=2881 --user=admin --password=admin \
            --database=test --tmpdir="$WORK/tmp" --logdir="$WORK/mysqltest_log" \
            --silent \
            --test-file="$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/t/file_sql_basic.test" \
            --result-file="$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/r/mysql/file_sql_basic.result" \
            --timer-file="$WORK/mysqltest_log/timer" --tail-lines=20
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mkdir -p "$WORK/failures"
            cp -a "$BASE/log" "$WORK/failures/seekdb_log" 2>/dev/null || true
            core_file="$(find "$BASE" -maxdepth 2 -type f -name 'core.*' | head -1)"
            if [ -n "$core_file" ]; then
              cp "$core_file" "$WORK/failures/"
              gdb -batch -ex 'thread apply all bt full' "$SEEKDB_BINARY" "$core_file" \
                > "$WORK/failures/backtrace.txt" 2>&1 || true
            fi
          fi
          exit "$rc"

      - name: Upload file SQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-test-only-diagnostics
          path: ${{ runner.temp }}/seekdb-file-sql-work/failures
          if-no-files-found: ignore
