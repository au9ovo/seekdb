name: File SQL Test Only

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch containing the integration test
        required: true
        default: feat/file-as-database
      runtime_run_id:
        description: Workflow run containing file-sql-seekdb and file-sql-obclient
        required: true

jobs:
  file-sql-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v3
        with:
          repository: au9ovo/seekdb
          ref: ${{ inputs.source_ref }}

      - name: Install runtime dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libaio1 libncurses5 python3

      - name: Download seekdb runtime
        uses: actions/download-artifact@v4
        with:
          name: file-sql-seekdb
          path: .seekdb_runtime/seekdb-bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime_run_id }}

      - name: Download obclient runtime
        uses: actions/download-artifact@v4
        with:
          name: file-sql-obclient
          path: .seekdb_runtime/obclient
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime_run_id }}

      - name: Run file SQL integration test
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD"
          SEEKDB_BINARY="$REPO_ROOT/.seekdb_runtime/seekdb-bin/seekdb"
          CLIENT_ROOT="$REPO_ROOT/.seekdb_runtime/obclient"
          chmod +x "$SEEKDB_BINARY" "$CLIENT_ROOT/bin/obclient" "$CLIENT_ROOT/bin/mysqltest"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          BASE="$RUNNER_TEMP/seekdb-file-sql-instance"
          WORK="$RUNNER_TEMP/seekdb-file-sql-work"
          rm -rf "$BASE" "$WORK"
          mkdir -p "$WORK/tmp" "$WORK/mysqltest_log"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$SEEKDB_BINARY" --base-dir "$BASE" --port 2881
          trap 'python3 .github/script/seekdb/sdb.py destroy --base-dir "$BASE" >/dev/null 2>&1 || true' EXIT
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" --base-dir "$BASE" \
            --host 127.0.0.1 --port 2881 --user root --timeout 600
          "$CLIENT_ROOT/bin/obclient" -h 127.0.0.1 -P 2881 -uroot -A -c \
            -Doceanbase < "$REPO_ROOT/tools/deploy/init.sql"
          DATA_DIR="$BASE/data_for_mysqltest_file_sql"
          mkdir -p "$DATA_DIR"
          cp "$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/data/"* "$DATA_DIR/"
          base64 -d "$DATA_DIR/simple.parquet.b64" > "$DATA_DIR/simple.parquet"
          rm -f "$DATA_DIR/simple.parquet.b64"
          export OBMYSQL_PORT=2881
          export OBMYSQL_MS0=127.0.0.1
          export OBMYSQL_MS0_DEV=127.0.0.1
          export OBMYSQL_PWD=admin
          export OBMYSQL_USR=admin
          export OBSERVER_DIR="$BASE"
          export FILE_SQL_REPO_ROOT="$REPO_ROOT"
          export IS_BUSINESS=0
          export TENANT=mysql
          cd "$REPO_ROOT/tools/deploy"
          set +e
          "$CLIENT_ROOT/bin/mysqltest" \
            --host=127.0.0.1 --port=2881 --user=admin --password=admin \
            --database=test --tmpdir="$WORK/tmp" --logdir="$WORK/mysqltest_log" \
            --silent \
            --test-file="$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/t/file_sql_basic.test" \
            --result-file="$REPO_ROOT/tools/deploy/mysql_test/test_suite/file_sql/r/mysql/file_sql_basic.result" \
            --timer-file="$WORK/mysqltest_log/timer" --tail-lines=20
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mkdir -p "$WORK/failures"
            cp -a "$BASE/log" "$WORK/failures/seekdb_log" 2>/dev/null || true
          fi
          exit "$rc"

      - name: Upload file SQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-test-only-diagnostics
          path: ${{ runner.temp }}/seekdb-file-sql-work/failures
          if-no-files-found: ignore
