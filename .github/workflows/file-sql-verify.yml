name: File SQL Verify

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to compile
        required: true
        default: feat/file-as-database

jobs:
  ubuntu-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Checkout verification branch
        uses: actions/checkout@v3
        with:
          repository: au9ovo/seekdb
          ref: ${{ inputs.source_ref }}

      - name: Install build dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: false

      - name: Initialize release build
        shell: bash
        run: |
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

      - name: Build seekdb
        shell: bash
        run: |
          cd build_release
          make -j4 seekdb
          test -x src/observer/seekdb

      - name: Save seekdb runtime
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-seekdb
          path: build_release/src/observer/seekdb
          if-no-files-found: error
          compression-level: 1

      - name: Save obclient runtime
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-obclient
          path: deps/3rd/u01/obclient
          if-no-files-found: error
          compression-level: 1

