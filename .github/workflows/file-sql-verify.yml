name: File SQL Verify

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to compile
        required: true
        default: feat/file-as-database

jobs:
  ubuntu-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Checkout verification branch
        uses: actions/checkout@v3
        with:
          repository: au9ovo/seekdb
          ref: ${{ inputs.source_ref }}

      - name: Install build dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: false

      - name: Initialize release build
        shell: bash
        run: |
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

      - name: Build seekdb
        shell: bash
        run: |
          cd build_release
          make -j4 seekdb
          test -x src/observer/seekdb

      - name: Run file SQL integration test
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          read CASE_INDEX CASE_COUNT <<<"$(python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/script/seekdb").resolve()))
          import mysqltest_for_seekdb as runner

          cases = runner.discover_cases(Path(".").resolve())
          for index, case in enumerate(cases):
              if case.test_file.name == "file_sql_basic.test":
                  print(index, len(cases))
                  break
          else:
              raise SystemExit("file_sql_basic.test was not discovered")
          PY
          )"
          echo "Running file_sql_basic.test (index $CASE_INDEX of $CASE_COUNT)"
          python3 .github/script/seekdb/mysqltest_for_seekdb.py run \
            --seekdb build_release/src/observer/seekdb \
            --obclient "$CLIENT_ROOT/bin/obclient" \
            --mysqltest "$CLIENT_ROOT/bin/mysqltest" \
            --base-dir "$RUNNER_TEMP/seekdb-file-sql-instance" \
            --work-dir "$RUNNER_TEMP/seekdb-file-sql-work" \
            --host 127.0.0.1 \
            --port 2881 \
            --slice-index "$CASE_INDEX" \
            --slice-count "$CASE_COUNT"

      - name: Upload file SQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-diagnostics
          path: ${{ runner.temp }}/seekdb-file-sql-work/failures
          if-no-files-found: ignore
